{% if messages %}
<div class="mt-3">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show border-0 rounded-4 shadow-sm" role="alert" 
             {% if message.tags == 'error' %}style="background: rgba(255, 71, 87, 0.1); color: #ff4757;"
             {% elif message.tags == 'info' %}style="background: rgba(52, 152, 219, 0.1); color: #3498db;"
             {% elif message.tags == 'success' %}style="background: rgba(0, 184, 148, 0.1); color: #00b894;"
             {% elif message.tags == 'warning' %}style="background: rgba(253, 203, 110, 0.1); color: #fdcb6e;"
             {% endif %}>
            <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% elif message.tags == 'success' %}fa-check-circle{% else %}fa-info-circle{% endif %} me-2"></i> {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
</div>
{% endif %}
