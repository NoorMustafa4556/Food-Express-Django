<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food Item - Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        {% include 'food/messages.html' %}
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-danger text-white p-4 rounded-top-4">
                        <h4 class="mb-0">Add New Food Item</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="categorySelect" class="form-label fw-bold">Select Category</label>
                                <select id="categorySelect" name="category" class="form-select" required aria-label="Select Category">
                                    {% for category in categories %}
                                        <option value="{{ category.id }}">{{ category.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="itemName" class="form-label fw-bold">Item Name</label>
                                <input type="text" id="itemName" name="name" class="form-control" placeholder="e.g. Zinger Burger" required>
                            </div>
                            <div class="mb-3">
                                <label for="itemPrice" class="form-label fw-bold">Price (Rs.)</label>
                                <input type="number" id="itemPrice" name="price" class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="mb-3">
                                <label for="itemDesc" class="form-label fw-bold">Description</label>
                                <textarea id="itemDesc" name="description" class="form-control" rows="3" placeholder="Tell us about this food..." required></textarea>
                            </div>
                            <div class="mb-4">
                                <label for="itemImage" class="form-label fw-bold">Item Image</label>
                                <input type="file" id="itemImage" name="image" class="form-control" required title="Upload Food Image">
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-danger flex-grow-1 p-2 fw-bold">Add Item</button>
                                <a href="{% url 'admin-dashboard' %}" class="btn btn-secondary px-4 d-flex align-items-center justify-content-center">Back</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
