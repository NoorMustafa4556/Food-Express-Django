<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ff4757, #ff6b81, #ffa502);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        .profile-img-container {
            width: 160px;
            height: 160px;
            margin: 0 auto;
            position: relative;
        }
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.25);
        }
        .edit-icon-overlay {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #2f3542;
            color: white;
            border-radius: 50%;
            padding: 10px 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        {% include 'food/messages.html' %}
        <div class="d-flex justify-content-between mb-4">
             <a href="{% url 'home' %}" class="btn btn-dark rounded-pill px-4 shadow-sm">Home</a>
             <a href="{% url 'logout' %}" class="btn btn-danger rounded-pill px-4 shadow-sm">Logout</a>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card glass-card p-5">
                    <h3 class="text-center fw-bold mb-4">Edit Profile</h3>
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <input type="hidden" name="update_profile" value="1">
                        <div class="text-center mb-4">
                            <div class="profile-img-container">
                                {% if user.profile.image %}
                                <img src="{{ user.profile.image.url }}" class="profile-img" id="previewImg" alt="Profile image">
                                {% else %}
                                <img src="https://via.placeholder.com/150" class="profile-img" id="previewImg" alt="Profile image">
                                {% endif %}
                                <label for="fileInput" class="edit-icon-overlay"><i class="bi bi-camera-fill"></i></label>
                                <input type="file" id="fileInput" name="profile_image" class="d-none" onchange="loadFile(event)" aria-label="Upload profile image">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="fullNameInput" class="form-label fw-bold">Full Name</label>
                            <input type="text" id="fullNameInput" name="full_name" class="form-control rounded-pill px-3" value="{{ user.first_name }}" placeholder="Full Name">
                        </div>
                        <div class="mb-3">
                            <label for="usernameInput" class="form-label fw-bold">Username</label>
                            <input type="text" id="usernameInput" name="username" class="form-control rounded-pill px-3" value="{{ user.username }}" placeholder="Username" required>
                        </div>
                        <div class="mb-4">
                            <label for="emailInput" class="form-label fw-bold">Email</label>
                            <input type="email" id="emailInput" name="email" class="form-control rounded-pill px-3" value="{{ user.email }}" placeholder="Email" required>
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-danger rounded-pill fw-bold py-2">Save Changes</button>
                            <a href="{% url 'change-password' %}" class="btn btn-outline-dark rounded-pill fw-bold py-2">Change Password</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        var loadFile = function (event) {
            var output = document.getElementById('previewImg');
            output.src = URL.createObjectURL(event.target.files[0]);
        };
    </script>
</body>
</html>
