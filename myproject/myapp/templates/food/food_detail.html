<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ item.name }} - The Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #ff4757; }
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .detail-card { border: none; border-radius: 25px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.1); background: white; }
        .food-img { height: 450px; object-fit: cover; }
        .btn-custom { background: var(--primary-color); color: white; border-radius: 30px; border: none; padding: 12px 30px; font-weight: 600; }
        .btn-custom:hover { background: #e04050; color: white; transform: scale(1.05); }
        .btn-fav { border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .fav-active { color: #ff4757; border-color: #ff4757; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="detail-card">
                    <div class="row g-0">
                        <div class="col-md-6">
                            {% if item.image %}
                                <img src="{{ item.image.url }}" class="food-img w-100" alt="{{ item.name }}">
                            {% else %}
                                <img src="https://via.placeholder.com/450" class="food-img w-100" alt="placeholder">
                            {% endif %}
                        </div>
                        <div class="col-md-6 p-5">
                            <nav aria-label="breadcrumb" class="mb-4">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a href="{% url 'home' %}" class="text-decoration-none">Home</a></li>
                                    <li class="breadcrumb-item"><a href="{% url 'category-items' item.category.id %}" class="text-decoration-none">{{ item.category.name }}</a></li>
                                    <li class="breadcrumb-item active">{{ item.name }}</li>
                                </ol>
                            </nav>
    <div class="container mt-3">
        {% include 'food/messages.html' %}
    </div>

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h1 class="fw-bold mb-0">{{ item.name }}</h1>
                                <a href="{% url 'toggle-favorite' item.id %}" class="btn btn-outline-secondary btn-fav {% if is_favorite %}btn-outline-danger fav-active{% endif %} shadow-sm">
                                    <i class="fa{% if is_favorite %}s{% else %}r{% endif %} fa-heart fa-lg"></i>
                                </a>
                            </div>

                            <h3 class="text-success fw-bold mb-4">Rs. {{ item.price }}</h3>
                            
                            <h5 class="fw-bold mb-2">Description</h5>
                            <p class="text-muted mb-5" style="line-height: 1.8;">{{ item.description }}</p>

                            <div class="d-grid gap-3">
                                <a href="{% url 'place-order' item.id %}" class="btn btn-custom btn-lg shadow-sm">
                                    <i class="fas fa-shopping-cart me-2"></i> Order Now
                                </a>
                                <a href="{% url 'home' %}" class="btn btn-outline-dark btn-lg rounded-pill shadow-sm text-center">
                                    Back to Menu
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
