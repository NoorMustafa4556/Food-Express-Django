<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order {{ item.name }} - The Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #ff4757; --light-bg: #f8f9fa; }
        body { background: var(--light-bg); font-family: 'Segoe UI', sans-serif; }
        .order-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: white; overflow: hidden; }
        .food-img { height: 300px; object-fit: cover; }
        .btn-custom { background: var(--primary-color); color: white; border-radius: 30px; border: none; padding: 12px; font-weight: 600; }
        .btn-custom:hover { background: #e04050; color: white; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="container py-5">
        {% include 'food/messages.html' %}
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="order-card">
                    <div class="row g-0">
                        <div class="col-md-5">
                            {% if item.image %}
                                <img src="{{ item.image.url }}" class="food-img w-100 h-100" alt="{{ item.name }}">
                            {% else %}
                                <img src="https://via.placeholder.com/300" class="food-img w-100 h-100" alt="placeholder">
                            {% endif %}
                        </div>
                        <div class="col-md-7 p-4">
                            <div class="d-flex justify-content-between align-items-start">
                                <h2 class="fw-bold mb-1">{{ item.name }}</h2>
                                <a href="{% url 'home' %}" class="btn-close" aria-label="Close"></a>
                            </div>
                            <p class="text-muted mb-4">{{ item.description }}</p>
                            
                            <h4 class="text-success fw-bold mb-4">Rs. {{ item.price }}</h4>
                            
                            <form method="POST">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="citySelect" class="form-label fw-bold small text-uppercase">Select City</label>
                                    <select id="citySelect" name="city" class="form-select rounded-pill" required aria-label="City selection">
                                        {% for city in cities %}
                                            <option value="{{ city }}">{{ city }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mb-4">
                                    <label for="qtyInput" class="form-label fw-bold small text-uppercase">Quantity</label>
                                    <input type="number" id="qtyInput" name="quantity" value="1" min="1" class="form-control rounded-pill" required placeholder="1">
                                </div>
                                <button type="submit" class="btn btn-custom w-100 shadow-sm">
                                    <i class="fas fa-shopping-basket me-2"></i> PLACE ORDER NOW
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
