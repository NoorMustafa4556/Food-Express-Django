<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join The Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ffa502, #ff6b81, #ff4757);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 40px 0;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .signup-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            border: none;
        }
        .signup-header { background: #2f3542; color: white; padding: 40px; text-align: center; }
        .form-control, .form-select { border-radius: 15px; padding: 10px 20px; border: 2px solid #eee; }
        .form-control:focus { border-color: #ff4757; box-shadow: none; }
        .btn-signup {
            background: #ff4757; color: white; border-radius: 15px; padding: 12px;
            font-weight: 600; border: none; transition: 0.3s;
        }
        .btn-signup:hover { background: #ff6b81; transform: translateY(-2px); }
        .login-link { color: #ff4757; font-weight: 600; text-decoration: none; }
        .profile-upload { 
            width: 100px; height: 100px; background: #eee; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
            cursor: pointer; overflow: hidden; border: 3px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .profile-upload img { width: 100%; height: 100%; object-fit: cover; }
        .upload-badge {
            position: absolute; bottom: 0; right: 0; background: #ff4757;
            color: white; width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid white; font-size: 14px;
        }
        .password-field-container { position: relative; }
        .toggle-password {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #747d8c; transition: 0.3s;
        }
        .toggle-password:hover { color: #ff4757; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card signup-card">
                    <div class="signup-header">
                        <i class="fas fa-user-plus fa-3x mb-3"></i>
                        <h2 class="fw-bold mb-0">JOIN THE EXPRESS</h2>
                        <p class="small opacity-75 mb-0">Create your account to start ordering</p>
                    </div>
                    <div class="card-body p-5">
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            
                            <div class="position-relative mx-auto" style="width: 100px;">
                                <div class="profile-upload" onclick="document.getElementById('id_image').click();">
                                    <img id="preview" src="https://via.placeholder.com/100?text=+" alt="Preview">
                                    <div class="upload-badge"><i class="fas fa-plus"></i></div>
                                    <input type="file" name="profile_image" id="id_image" class="d-none" onchange="previewImage(this)" aria-label="Upload Profile Photo">
                                </div>
                            </div>
                            <p class="text-center small text-muted mb-4">Click to upload photo</p>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="usernameField" class="form-label small fw-bold text-muted">Username</label>
                                    <input type="text" id="usernameField" name="username" class="form-control" required placeholder="User123">
                                </div>
                                <div class="col-md-6">
                                    <label for="emailField" class="form-label small fw-bold text-muted">Email</label>
                                    <input type="email" id="emailField" name="email" class="form-control" required placeholder="Email@example.com">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="passField" class="form-label small fw-bold text-muted">Password</label>
                                <div class="password-field-container">
                                    <input type="password" id="passField" name="password" class="form-control" required placeholder="Create a strong password">
                                    <i class="fas fa-eye toggle-password" onclick="togglePassword('passField', this)"></i>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-signup w-100 mb-4 shadow-sm">Create Account</button>
                            <p class="text-center mb-0 small text-muted">
                                Already have an account? <a href="{% url 'login' %}" class="login-link">Login</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function previewImage(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function togglePassword(fieldId, icon) {
            const passwordField = document.getElementById(fieldId);
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
