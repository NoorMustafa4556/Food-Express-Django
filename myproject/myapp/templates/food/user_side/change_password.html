<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - The Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ff4757, #ff6b81, #ffa502);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .change-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            border: none;
        }
        .change-header {
            background: #2f3542;
            color: white;
            padding: 40px;
            text-align: center;
        }
        .form-control {
            border-radius: 15px;
            padding: 12px 20px;
            border: 2px solid #eee;
        }
        .form-control:focus {
            border-color: #ff4757;
            box-shadow: none;
        }
        .btn-change {
            background: #ff4757;
            color: white;
            border-radius: 15px;
            padding: 12px;
            font-weight: 600;
            border: none;
            transition: 0.3s;
        }
        .btn-change:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }
        .back-link { color: #2f3542; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card change-card">
                    <div class="change-header">
                        <i class="fas fa-lock fa-3x mb-3"></i>
                        <h2 class="fw-bold mb-0">CHANGE PASSWORD</h2>
                        <p class="small opacity-75 mb-0">Secure your account</p>
                    </div>
                    <div class="card-body p-5">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show border-0 rounded-4 mb-4" role="alert" style="background: rgba(255, 71, 87, 0.1); color: #ff4757;">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Current Password</label>
                                <input type="password" name="old_password" class="form-control" placeholder="Enter current password" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">New Password</label>
                                <input type="password" name="new_password" class="form-control" placeholder="Min 8 characters" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted">Confirm New Password</label>
                                <input type="password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
                            </div>
                            <button type="submit" class="btn btn-change w-100 mb-4 shadow-sm">Update Password</button>
                            <p class="text-center mb-0 small">
                                <a href="{% url 'profile' %}" class="back-link"><i class="fas fa-arrow-left me-1"></i> Back to Profile</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
