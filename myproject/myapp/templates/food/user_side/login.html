<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ff4757, #ff6b81, #ffa502);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            border: none;
        }
        .login-header {
            background: #2f3542;
            color: white;
            padding: 40px;
            text-align: center;
        }
        .form-control {
            border-radius: 15px;
            padding: 12px 20px;
            border: 2px solid #eee;
        }
        .form-control:focus {
            border-color: #ff4757;
            box-shadow: none;
        }
        .btn-login {
            background: #ff4757;
            color: white;
            border-radius: 15px;
            padding: 12px;
            font-weight: 600;
            border: none;
            transition: 0.3s;
        }
        .btn-login:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }
        .signup-link { color: #ff4757; font-weight: 600; text-decoration: none; }
        .password-field-container { position: relative; }
        .toggle-password {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #747d8c; transition: 0.3s;
        }
        .toggle-password:hover { color: #ff4757; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card">
                    <div class="login-header">
                        <i class="fas fa-utensils fa-3x mb-3"></i>
                        <h2 class="fw-bold mb-0">THE FOOD EXPRESS</h2>
                        <p class="small opacity-75 mb-0">Sign in to start ordering</p>
                    </div>
                    <div class="card-body p-5">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show border-0 rounded-4 mb-4" role="alert" 
                                     {% if message.tags == 'error' %}style="background: rgba(255, 71, 87, 0.1); color: #ff4757;"
                                     {% elif message.tags == 'info' %}style="background: rgba(52, 152, 219, 0.1); color: #3498db;"
                                     {% endif %}>
                                    <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %} me-2"></i> {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-4 text-center">
                                <h4 class="fw-bold">Welcome Back</h4>
                            </div>
                            <div class="mb-3">
                                <label for="usernameLogin" class="form-label small fw-bold text-muted">Username</label>
                                <input type="text" id="usernameLogin" name="username" class="form-control" placeholder="Enter username" required>
                            </div>
                            <div class="mb-4">
                                <label for="passwordLogin" class="form-label small fw-bold text-muted">Password</label>
                                <div class="password-field-container">
                                    <input type="password" id="passwordLogin" name="password" class="form-control" placeholder="Enter password" required>
                                    <i class="fas fa-eye toggle-password" onclick="togglePassword('passwordLogin', this)"></i>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-login w-100 mb-4 shadow-sm">Login</button>
                            <p class="text-center mb-0 small text-muted">
                                Don't have an account? <a href="{% url 'signup' %}" class="signup-link">Sign up</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function togglePassword(fieldId, icon) {
            const passwordField = document.getElementById(fieldId);
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
