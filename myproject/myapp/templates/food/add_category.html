<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Category - Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        {% include 'food/messages.html' %}
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-danger text-white p-4 rounded-top-4">
                        <h4 class="mb-0">Add New Category</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="catName" class="form-label fw-bold">Category Name</label>
                                <input type="text" id="catName" name="name" class="form-control" placeholder="e.g. Fast Food" required>
                            </div>
                            <div class="mb-4">
                                <label for="catImage" class="form-label fw-bold">Category Image</label>
                                <input type="file" id="catImage" name="image" class="form-control" title="Choose Category Image">
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-danger flex-grow-1 p-2 fw-bold">Add Category</button>
                                <a href="{% url 'admin-dashboard' %}" class="btn btn-secondary px-4 d-flex align-items-center justify-content-center">Back</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
